<!DOCTYPE html>
<!--
  dashboard.html — Inklub Store Manager
  Main Application Shell

  Updated: Pedidos screen removed — orders are managed in Trello.
  Inventario is now the default screen that loads on login.

  SCREENS:
  - #screen-inicio      → Dashboard / Inicio (inventory overview)
  - #screen-inventario  → Inventory / Inventario (main screen)
  - #screen-clientes    → Customers / Clientes
  - #screen-settings    → Settings / Configuración
-->
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inklub — Gestión de tienda</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <div class="app">

    <!-- ==========================================================
         TOPBAR
         ========================================================== -->
    <header class="topbar">

      <div class="topbar-logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1" width="6" height="22" rx="1.5" fill="white" />
            <rect x="9" y="1" width="6" height="22" rx="1.5" fill="white" />
            <rect x="17" y="1" width="6" height="22" rx="1.5" fill="white" />
          </svg>
        </div>
        <div>
          <div class="logo-name">Inklub</div>
          <div class="logo-subtitle">Gestión de tienda</div>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="market-toggle">
          <button data-market="ca" class="active">CA</button>
          <button data-market="pa">PA</button>
        </div>
        <button class="btn-settings" id="btn-settings" title="Configuración">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="#111111" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
              stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </header>


    <!-- ==========================================================
         NAVIGATION TABS
         Pedidos removed — now just 3 tabs + settings gear
         ========================================================== -->
    <nav class="nav">
      <button data-screen="inicio">Inicio</button>
      <button data-screen="inventario" class="active">Inventario</button>
    </nav>


    <!-- ==========================================================
         MARKET LABEL
         ========================================================== -->
    <div class="market-label" id="market-label">
      🇨🇦 Canadá · CAD · e-Transfer
    </div>


    <!-- ==========================================================
         SCREEN CONTAINERS
         Inventario is now active by default instead of Inicio
         ========================================================== -->
    <main class="page-content">

      <!-- Inicio — simplified inventory overview -->
      <div class="screen" id="screen-inicio"></div>

      <!-- Inventario — main screen, active by default -->
      <div class="screen active" id="screen-inventario">
        <div class="loading">Cargando...</div>
      </div>

      <!-- Configuración -->
      <div class="screen" id="screen-settings"></div>

    </main>

  </div>

  <script type="module">
    import { checkAuthStatus } from './js/api.js';
    import { initApp } from './js/dashboard.js';

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const status = await checkAuthStatus();
        if (!status.logged_in) {
          window.location.href = 'index.html';
          return;
        }
        initApp();
      } catch (error) {
        console.error('Auth check failed:', error);
        window.location.href = 'index.html';
      }
    });
  </script>

</body>

</html>
